<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion — Facturier Pro</title>
  <link rel="stylesheet" href="style.css?v=14">
</head>
<body class="login-page">
  <form id="auth-form" class="login-card" novalidate>
    <h2>Facturier Pro</h2>
    <p class="login-hint" id="auth-hint">Cette instance synchronise vos données sur le serveur. Identifiez-vous pour y accéder.</p>

    <div id="auth-fields">
      <label class="login-label" id="field-email-label">Email
        <input type="email" id="auth-email" required autocomplete="username">
      </label>
      <label class="login-label" id="field-password-label">Mot de passe
        <input type="password" id="auth-password" required autocomplete="current-password">
      </label>
      <label class="login-label" id="field-confirm-label" style="display:none;">Confirmer le mot de passe
        <input type="password" id="auth-confirm" required autocomplete="new-password" style="display:none;">
      </label>
    </div>

    <div id="login-error" class="login-error"></div>
    <div id="login-info" class="login-info"></div>
    <div id="verify-resend" class="login-info" style="display:none;">
      Pas reçu ? <a href="#" id="link-resend-verify">Renvoyer l'email de vérification</a>.
    </div>

    <button type="submit" id="auth-submit" class="btn btn-primary btn-block">Se connecter</button>

    <div class="login-links" id="auth-links">
      <a href="#" id="link-register">Créer un compte</a>
      <span>·</span>
      <a href="#" id="link-forgot">Mot de passe oublié</a>
    </div>
  </form>

  <script>
    (async () => {
      // Sans backend (ex. GitHub Pages) : cette page n'a pas de sens → app locale
      try {
        const h = await fetch('/api/health').then((r) => r.json());
        if (!h || !h.server) throw new Error('local');
      } catch (e) {
        location.replace('/');
        return;
      }

      const params = new URLSearchParams(location.search);
      const resetToken = params.get('reset');
      const verifyToken = params.get('verify');

      // Retour à la page demandée initialement (302 /login.html?next=...)
      const next = params.get('next');
      const safeNext = next && next.startsWith('/') && !next.startsWith('//') ? next : '/';

      // Déjà connecté : pas besoin du formulaire (sauf reset/vérification en cours)
      if (!resetToken && !verifyToken) {
        const probe = await fetch('/api/state', { credentials: 'same-origin' });
        if (probe.ok) {
          location.replace(safeNext);
          return;
        }
      }

      const form = document.getElementById('auth-form');
      const hintEl = document.getElementById('auth-hint');
      const errEl = document.getElementById('login-error');
      const infoEl = document.getElementById('login-info');
      const submitBtn = document.getElementById('auth-submit');
      const emailEl = document.getElementById('auth-email');
      const passwordEl = document.getElementById('auth-password');
      const confirmLabel = document.getElementById('field-confirm-label');
      const confirmEl = document.getElementById('auth-confirm');
      const linksEl = document.getElementById('auth-links');
      const resendEl = document.getElementById('verify-resend');

      // --- modes : login | register | forgot | reset | verify ---
      let mode = resetToken ? 'reset' : verifyToken ? 'verify' : 'login';

      function setMode(m) {
        mode = m;
        errEl.textContent = '';
        infoEl.textContent = '';
        resendEl.style.display = 'none';
        confirmLabel.style.display = (m === 'register' || m === 'reset') ? '' : 'none';
        confirmEl.style.display = (m === 'register' || m === 'reset') ? '' : 'none';
        emailEl.parentElement.style.display = (m === 'reset' || m === 'verify') ? 'none' : '';
        passwordEl.parentElement.style.display = (m === 'forgot' || m === 'verify') ? 'none' : '';
        passwordEl.setAttribute('autocomplete',
          m === 'login' ? 'current-password' : 'new-password');
        submitBtn.style.display = m === 'verify' ? 'none' : '';
        linksEl.style.display = (m === 'reset' || m === 'verify') ? 'none' : '';
        if (m === 'login') {
          hintEl.textContent = 'Cette instance synchronise vos données sur le serveur. Identifiez-vous pour y accéder.';
          submitBtn.textContent = 'Se connecter';
        } else if (m === 'register') {
          hintEl.textContent = 'Compte réservé aux adresses @hoplacollect.fr, @eldcontrole.fr et @controleweb.fr. Un lien de vérification vous sera envoyé par email.';
          submitBtn.textContent = 'Créer mon compte';
        } else if (m === 'forgot') {
          hintEl.textContent = 'Indiquez votre email : vous recevrez un lien de réinitialisation (valable 1 heure).';
          submitBtn.textContent = 'Envoyer le lien';
        } else if (m === 'verify') {
          hintEl.textContent = 'Vérification de votre adresse email…';
        } else {
          hintEl.textContent = 'Choisissez un nouveau mot de passe pour votre compte.';
          submitBtn.textContent = 'Enregistrer le mot de passe';
        }
        if (m !== 'verify') (m === 'reset' ? passwordEl : emailEl).focus();
      }

      function busy(b) {
        submitBtn.disabled = b;
      }

      async function api(path, body) {
        const r = await fetch(path, {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const j = await r.json().catch(() => ({}));
        return { ok: r.ok, status: r.status, j };
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errEl.textContent = '';
        infoEl.textContent = '';
        busy(true);
        try {
          if (mode === 'login') {
            const { ok, j } = await api('/api/login', {
              email: emailEl.value.trim(),
              password: passwordEl.value,
            });
            if (ok) {
              location.replace(safeNext);
              return;
            }
            errEl.textContent = j.error || 'Identifiants incorrects';
            if (j.code === 'email_unverified') resendEl.style.display = '';
          } else if (mode === 'register') {
            if (passwordEl.value !== confirmEl.value) {
              errEl.textContent = 'Les deux mots de passe ne correspondent pas';
              busy(false);
              return;
            }
            const { ok, j } = await api('/api/register', {
              email: emailEl.value.trim(),
              password: passwordEl.value,
            });
            if (ok) {
              const msg = j.emailSent === false
                ? 'Compte créé, mais l\u2019email de vérification n\u2019a pas pu être envoyé (serveur SMTP mal configuré) — contactez l\u2019administrateur.'
                : 'Compte créé ! Ouvrez le lien de vérification envoyé par email (valable 24 h), puis connectez-vous.';
              passwordEl.value = '';
              confirmEl.value = '';
              setMode('login'); // bascule le formulaire en connexion
              infoEl.textContent = msg;
              busy(false);
              return;
            }
            errEl.textContent = j.error || 'Création impossible';
          } else if (mode === 'forgot') {
            const { ok, j } = await api('/api/password/forgot', { email: emailEl.value.trim() });
            if (ok) {
              infoEl.textContent = 'Si un compte existe pour cet email, un lien de réinitialisation vient d\u2019être envoyé (pensez à vos indésirables).';
              emailEl.value = '';
            } else {
              errEl.textContent = j.error || 'Demande impossible';
            }
          } else { // reset
            if (passwordEl.value !== confirmEl.value) {
              errEl.textContent = 'Les deux mots de passe ne correspondent pas';
              busy(false);
              return;
            }
            const { ok, j } = await api('/api/password/reset', {
              token: resetToken,
              password: passwordEl.value,
            });
            if (ok) {
              infoEl.textContent = 'Mot de passe modifié — vous pouvez vous connecter.';
              passwordEl.value = '';
              confirmEl.value = '';
              setTimeout(() => {
                history.replaceState(null, '', '/login.html');
                setMode('login');
              }, 1500);
            } else {
              errEl.textContent = j.error || 'Lien invalide ou expiré';
            }
          }
        } catch (err) {
          errEl.textContent = 'Serveur injoignable';
        }
        busy(false);
      });

      document.getElementById('link-register').addEventListener('click', (e) => {
        e.preventDefault();
        setMode(mode === 'register' ? 'login' : 'register');
      });
      document.getElementById('link-forgot').addEventListener('click', (e) => {
        e.preventDefault();
        setMode(mode === 'forgot' ? 'login' : 'forgot');
      });
      document.getElementById('link-resend-verify').addEventListener('click', async (e) => {
        e.preventDefault();
        resendEl.style.display = 'none';
        errEl.textContent = '';
        infoEl.textContent = 'Envoi du lien de vérification…';
        try {
          const { ok, j } = await api('/api/email/resend', { email: emailEl.value.trim() });
          infoEl.textContent = ok
            ? 'Si un compte non vérifié existe pour cet email, un nouveau lien vient d\u2019être envoyé (valable 24 h).'
            : (j.error || 'Envoi impossible');
        } catch (err) {
          infoEl.textContent = 'Serveur injoignable';
        }
      });

      setMode(mode);

      // Mode vérification : jeton reçu par email (?verify=...) — échangé
      // automatiquement contre l'activation du compte, puis formulaire login.
      if (mode === 'verify') {
        let verifyOk = false;
        let verifyMsg = 'Serveur injoignable';
        try {
          const { ok, j } = await api('/api/email/verify', { token: verifyToken });
          verifyOk = ok;
          verifyMsg = ok
            ? 'Adresse vérifiée — vous pouvez maintenant vous connecter.'
            : (j.error || 'Lien de vérification invalide ou expiré.');
        } catch (err) { /* message par défaut conservé */ }
        history.replaceState(null, '', '/login.html');
        setMode('login');
        (verifyOk ? infoEl : errEl).textContent = verifyMsg;
      }
    })();
  </script>
</body>
</html>
