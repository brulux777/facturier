# Facturier — nginx conteneur (statique)
# Servi derrière le nginx hôte du VPS (reverse proxy 127.0.0.1:8105).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Assets fingerprintables : cache long
    location ~* \.(css|js|svg|png|jpg|jpeg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # App monopage : tout retombe sur index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
